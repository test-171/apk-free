<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارية | إدارة الألعاب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #fff; padding: 20px; }
        .card { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 600px; margin: 20px auto; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 18px; font-size: 1.4rem; }
        label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #cbd5e1; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 16px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; outline: none; font-size: 0.95rem; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        button { background: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
        button:hover { background: #059669; }
        .btn-login { background: #0284c7; margin-top: 5px; }
        .btn-login:hover { background: #0369a1; }
        .list-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px 16px; margin-top: 10px; border-radius: 8px; border: 1px solid #334155; }
        .del-btn { background: #ef4444; width: auto; padding: 6px 14px; font-size: 0.85rem; }
        .del-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

<!-- كارت تسجيل الدخول -->
<div class="card" id="loginCard">
    <h2>تسجيل دخول لوحة التحكم</h2>
    <form id="loginForm">
        <label>كلمة السر:</label>
        <input type="password" id="adminPass" placeholder="أدخل كلمة سر الأدمن" required>
        <button type="submit" class="btn-login">دخول</button>
    </form>
</div>

<!-- لوحة التحكم الإدارية -->
<div class="card" id="adminPanel" style="display: none;">
    <h2>إضافة لعبة / تطبيق جديد</h2>
    <form id="addForm">
        <label>عنوان اللعبة / التطبيق:</label>
        <input type="text" id="title" placeholder="مثال: GTA San Andreas" required>
        
        <label>التصنيف:</label>
        <select id="category">
            <option value="ألعاب">ألعاب</option>
            <option value="تطبيقات">تطبيقات</option>
            <option value="برامج وأدوات">برامج وأدوات</option>
        </select>
        
        <label>الوصف:</label>
        <textarea id="description" rows="3" placeholder="اكتب وصفاً قصيراً..."></textarea>
        
        <label>رابط صورة العرض (Image URL):</label>
        <input type="url" id="image_url" placeholder="https://example.com/image.jpg">
        
        <label>رابط MEGA المكتمل:</label>
        <input type="url" id="mega_url" placeholder="https://mega.nz/file/XXXXX#KEY" required>
        
        <button type="submit" id="submitBtn">إضافة المحتوى الآن</button>
    </form>

    <h2 style="margin-top: 35px;">العناصر المضافة حالياً</h2>
    <div id="itemsList">جاري التحميل...</div>
</div>

<script>
    let currentAdminPass = '';

    // عملية تسجيل الدخول والتحقق من كلمة السر
    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const passInput = document.getElementById('adminPass').value;
        
        // محاولة جلب الألعاب للتحقق الضمني من الصحة (أو تنفيذ طلب بسيط)
        currentAdminPass = passInput;
        const isLoaded = await loadAdminGames();

        if (isLoaded) {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        }
    };

    // جلب عناصر الألعاب
    async function loadAdminGames() {
        try {
            const res = await fetch('/api/games');
            if (!res.ok) throw new Error('فشل الاتصال بالخادم');
            
            const data = await res.json();
            const list = document.getElementById('itemsList');
            
            if (!Array.isArray(data) || data.length === 0) {
                list.innerHTML = '<p style="color: #94a3b8;">لا توجد عناصر مضافة بعد.</p>';
                return true;
            }

            list.innerHTML = data.map(item => `
                <div class="list-item">
                    <span><strong>${item.title}</strong> (${item.category || 'عام'})</span>
                    <button class="del-btn" onclick="deleteGame(${item.id})">حذف</button>
                </div>
            `).join('');
            return true;
        } catch (e) {
            alert('حدث خطأ في تحميل البيانات من السيرفر');
            return false;
        }
    }

    // إضافة لعبة جديدة
    document.getElementById('addForm').onsubmit = async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'جاري الإضافة...';

        const payload = {
            title: document.getElementById('title').value,
            category: document.getElementById('category').value,
            description: document.getElementById('description').value,
            image_url: document.getElementById('image_url').value,
            mega_url: document.getElementById('mega_url').value
        };

        try {
            const res = await fetch('/api/games', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': currentAdminPass
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('تمت إضافة العنصر بنجاح!');
                document.getElementById('addForm').reset();
                loadAdminGames();
            } else {
                const err = await res.json();
                alert('فشل الإضافة: ' + (err.error || 'كلمة السر خاطئة'));
            }
        } catch (e) {
            alert('حدث خطأ أثناء الإرسال إلى السيرفر');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'إضافة المحتوى الآن';
        }
    };

    // حذف لعبة
    async function deleteGame(id) {
        if (!confirm('هل أنت متأكد من إزالة هذا العنصر؟')) return;
        try {
            const res = await fetch(`/api/games?id=${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': currentAdminPass }
            });

            if (res.ok) {
                loadAdminGames();
            } else {
                const err = await res.json();
                alert('فشل الحذف: ' + (err.error || 'غير مصرح'));
            }
        } catch (e) {
            alert('حدث خطأ أثناء تنفيذ الحذف');
        }
    }
</script>

</body>
</html>
